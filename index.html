<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>成都与重庆之旅</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-4 py-3 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="bg-red-500 text-white p-2 rounded-xl shadow">
          <i class="fa-solid fa-plane-departure text-sm"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm">成都与重庆之旅</h1>
          <p class="text-[10px] text-slate-400">景点照片与行程浏览</p>
        </div>
      </div>
      <button onclick="location.reload()" class="px-3 py-1 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 text-xs rounded-lg font-medium">
        <i class="fa-solid fa-rotate-right mr-1"></i>刷新
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-4 space-y-4">
    
    <!-- Filter Panel -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/80 space-y-3">
      <!-- City Filter -->
      <div class="flex items-center gap-2">
        <span class="text-xs font-semibold text-slate-400 shrink-0">城市:</span>
        <div id="cityContainer" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
      </div>
      <!-- Category Filter -->
      <div class="flex items-center gap-2 pt-2 border-t border-slate-100 dark:border-slate-700/50">
        <span class="text-xs font-semibold text-slate-400 shrink-0">分类:</span>
        <div id="categoryContainer" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="locationGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Instant Loading Skeleton or Cards -->
    </div>
  </main>

  <script>
    let locations = [];
    let selectedCity = '全部';
    let selectedCategory = '全部';

    // Placeholder image in case local image isn't found
    const FALLBACK_IMG = 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=600';

    async function init() {
      try {
        const res = await fetch('./locations.json');
        if (res.ok) {
          const data = await res.json();
          locations = Array.isArray(data) ? data : (data.locations || []);
        }
      } catch (err) {
        console.error('Failed to load locations.json', err);
      }

      renderFilters();
      renderCards();
    }

    function renderFilters() {
      const cities = ['全部', ...new Set(locations.map(i => i.city).filter(Boolean))];
      const categories = ['全部', ...new Set(locations.map(i => i.category).filter(Boolean))];

      document.getElementById('cityContainer').innerHTML = cities.map(c => `
        <button onclick="filterCity('${c}')" class="px-3 py-1 rounded-full text-xs font-medium transition ${selectedCity === c ? 'bg-red-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">${c}</button>
      `).join('');

      document.getElementById('categoryContainer').innerHTML = categories.map(cat => `
        <button onclick="filterCategory('${cat}')" class="px-3 py-1 rounded-full text-xs font-medium transition ${selectedCategory === cat ? 'bg-red-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">${cat}</button>
      `).join('');
    }

    function filterCity(c) { selectedCity = c; renderFilters(); renderCards(); }
    function filterCategory(cat) { selectedCategory = cat; renderFilters(); renderCards(); }

    function getPrimaryImageUrl(item) {
      if (item.images && item.images.length > 0) return item.images[0];
      if (item.folder) return `${item.folder}/1.jpg`;
      return FALLBACK_IMG;
    }

    function handleImageError(imgElem, folder) {
      if (folder && !imgElem.dataset.triedImg1) {
        imgElem.dataset.triedImg1 = 'true';
        imgElem.src = `${folder}/img1.jpg`; // Try img1.jpg fallback
      } else {
        imgElem.src = FALLBACK_IMG; // Final default image
      }
    }

    function renderCards() {
      const grid = document.getElementById('locationGrid');
      const filtered = locations.filter(loc => {
        const matchCity = selectedCity === '全部' || loc.city === selectedCity;
        const matchCat = selectedCategory === '全部' || loc.category === selectedCategory;
        return matchCity && matchCat;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-10 text-xs text-slate-400">未找到相关景点</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const imgSrc = getPrimaryImageUrl(item);
        return `
          <div class="bg-white dark:bg-slate-800 rounded-2xl overflow-hidden shadow-sm border border-slate-200/80 dark:border-slate-700 flex flex-col">
            <div class="relative h-44 bg-slate-200 dark:bg-slate-700">
              <img src="${imgSrc}" 
                   loading="lazy"
                   onerror="handleImageError(this, '${item.folder || ''}')" 
                   class="w-full h-full object-cover">
              <div class="absolute top-2.5 left-2.5 flex gap-1">
                ${item.city ? `<span class="px-2 py-0.5 bg-red-500 text-white text-[10px] font-bold rounded-md">${item.city}</span>` : ''}
                ${item.category ? `<span class="px-2 py-0.5 bg-black/50 backdrop-blur-sm text-white text-[10px] rounded-md">${item.category}</span>` : ''}
              </div>
            </div>
            <div class="p-3.5 flex-grow flex flex-col justify-between space-y-2">
              <div>
                <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100">${item.name}</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 leading-relaxed">${item.description || ''}</p>
              </div>
              ${item.address ? `<p class="text-[11px] text-slate-400 flex items-center gap-1 pt-1"><i class="fa-solid fa-location-dot text-red-400"></i> ${item.address}</p>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
