<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重庆成都10日游 - Chongqing & Chengdu 10-Day Trip</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom scrollbar for smooth UI */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header & Navigation -->
  <header class="bg-gradient-to-r from-red-600 via-rose-600 to-amber-600 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-mountain-city text-3xl"></i>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">重庆成都10日游</h1>
          <p class="text-xs text-rose-100">Chongqing & Chengdu 10-Day Trip</p>
        </div>
      </div>
      
      <!-- Nav Tabs -->
      <nav class="flex bg-black/20 p-1 rounded-xl backdrop-blur-md">
        <button id="nav-locations" onclick="switchTab('locations')" 
          class="px-5 py-2 text-sm font-medium rounded-lg transition-all flex items-center gap-2 bg-white text-red-600 shadow-sm">
          <i class="fa-solid fa-map-location-dot"></i> 景点列表
        </button>
        <button id="nav-itinerary" onclick="switchTab('itinerary')" 
          class="px-5 py-2 text-sm font-medium rounded-lg transition-all flex items-center gap-2 text-white hover:text-rose-100">
          <i class="fa-solid fa-calendar-days"></i> 行程安排
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">

    <!-- View 1: Locations List -->
    <section id="view-locations" class="space-y-6">
      
      <!-- Search & Category/City Filters & Add Location -->
      <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
          
          <!-- Search Bar -->
          <div class="relative w-full md:w-80">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400"></i>
            <input type="text" id="search-input" oninput="filterLocations()" placeholder="搜索景点、城市、地址、描述..." 
              class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 transition">
          </div>

          <!-- Filters Container & Add Location Button -->
          <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto items-center justify-between">
            <div class="flex flex-wrap gap-2 items-center">
              <div id="city-filters" class="flex flex-wrap gap-2 items-center"></div>
              <div id="category-filters" class="flex flex-wrap gap-2 items-center"></div>
            </div>
            <button onclick="openLocationEditModal()" class="text-xs bg-red-600 hover:bg-red-500 text-white px-4 py-2.5 rounded-xl transition font-medium whitespace-nowrap shadow-sm flex items-center gap-1.5 shrink-0">
              <i class="fa-solid fa-plus"></i> 添加新景点
            </button>
          </div>
        </div>
        
        <!-- Global data tools bar -->
        <div class="pt-3 border-t border-slate-100 flex flex-wrap items-center gap-2 text-xs text-slate-500">
          <button onclick="exportData()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-900 text-white transition"><i class="fa-solid fa-download mr-1"></i>导出完整 JSON</button>
          <button onclick="document.getElementById('import-file').click()" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition"><i class="fa-solid fa-upload mr-1"></i>导入 JSON</button>
          <input type="file" id="import-file" accept=".json,application/json" class="hidden" onchange="importData(event)">
          <button onclick="resetAllData()" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-amber-100 text-slate-700 transition"><i class="fa-solid fa-rotate-left mr-1"></i>恢复原始所有数据</button>
          <span id="global-save-status" class="ml-auto text-slate-400"></span>
        </div>
      </div>

      <!-- Locations Grid -->
      <div id="locations-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <!-- Empty State -->
      <div id="no-locations" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-100">
        <i class="fa-solid fa-compass text-4xl text-slate-300 mb-3"></i>
        <p class="text-slate-500 font-medium">未找到符合条件的景点</p>
      </div>
    </section>

    <!-- View 2: Itinerary -->
    <section id="view-itinerary" class="hidden space-y-6">
      <div class="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-6 rounded-2xl shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 class="text-xl font-bold">行程规划</h2>
          <p id="itinerary-hint" class="text-slate-400 text-sm mt-1">点击「查看景点详情」可查看景点信息；点「编辑行程」可自由修改。</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button id="edit-toggle" onclick="toggleEdit()" class="text-sm bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg transition font-medium">
            <i class="fa-solid fa-pen-to-square mr-1"></i> 编辑行程
          </button>
          <button onclick="switchTab('locations')" class="text-xs bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg transition border border-white/10">
            <i class="fa-solid fa-arrow-left mr-1"></i> 返回所有景点
          </button>
        </div>
      </div>

      <!-- Edit tools (only in edit mode) -->
      <div id="edit-tools" class="hidden bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-wrap items-center gap-2">
        <button onclick="exportData()" class="text-xs px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-900 text-white transition"><i class="fa-solid fa-download mr-1"></i>导出 JSON</button>
        <button onclick="document.getElementById('import-file').click()" class="text-xs px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition"><i class="fa-solid fa-upload mr-1"></i>导入</button>
        <button onclick="resetItinerary()" class="text-xs px-3 py-2 rounded-lg bg-slate-100 hover:bg-amber-100 text-slate-700 transition"><i class="fa-solid fa-rotate-left mr-1"></i>恢复原始行程</button>
        <span id="save-status" class="text-xs text-slate-400 ml-auto"></span>
      </div>

      <!-- Itinerary List -->
      <div id="itinerary-container" class="space-y-8"></div>

      <button id="add-day-btn" onclick="addDay()" class="hidden w-full py-3 rounded-2xl border-2 border-dashed border-slate-300 text-slate-500 hover:border-red-400 hover:text-red-600 transition text-sm font-medium">
        <i class="fa-solid fa-plus mr-1"></i> 添加一天
      </button>
    </section>

  </main>

  <!-- Location Detail Modal -->
  <div id="location-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full overflow-hidden transform transition-all flex flex-col max-h-[92vh]">
      
      <!-- Modal Header -->
      <div class="bg-slate-900 text-white p-6 sm:p-7 relative">
        <button onclick="closeModal()" class="absolute right-5 top-5 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-full w-9 h-9 flex items-center justify-center transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <div class="flex items-center gap-2 mb-2">
          <span id="modal-category" class="bg-red-500/20 text-red-300 text-xs font-semibold px-3 py-1 rounded-full border border-red-500/30"></span>
          <span id="modal-city" class="text-slate-400 text-sm font-medium"></span>
        </div>
        <h3 id="modal-name" class="text-2xl sm:text-3xl font-bold pr-24"></h3>
      </div>

      <!-- Modal Body -->
      <div class="p-6 sm:p-8 space-y-6 overflow-y-auto">
        
        <!-- Grid Gallery Section -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
              <i class="fa-regular fa-images text-red-500 mr-1.5"></i>景点图库
            </span>
            <span class="text-xs text-slate-400 font-normal">点击缩略图放大预览，支持翻页查看</span>
          </div>

          <div id="gallery-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
          <p id="no-gallery-msg" class="hidden text-sm text-slate-400 italic py-6 text-center bg-slate-50 rounded-xl border border-dashed border-slate-200">
            暂无相册照片 (`img1.jpg` 或 `img1.jpeg`)
          </p>
        </div>

        <!-- Meta Info Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="flex items-start gap-3.5 text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-100 col-span-1 md:col-span-2">
            <i class="fa-solid fa-location-dot text-red-500 text-lg mt-0.5 shrink-0"></i>
            <div>
              <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">详细地址</p>
              <p id="modal-address" class="text-base font-medium text-slate-700 mt-1"></p>
            </div>
          </div>

          <div id="modal-time-box" class="hidden flex items-start gap-3.5 text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-100">
            <i class="fa-regular fa-clock text-red-500 text-lg mt-0.5 shrink-0"></i>
            <div>
              <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">开放/营业时间</p>
              <p id="modal-time" class="text-base font-medium text-slate-700 mt-1"></p>
            </div>
          </div>

          <div id="modal-fee-box" class="hidden flex items-start gap-3.5 text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-100">
            <i class="fa-solid fa-ticket text-red-500 text-lg mt-0.5 shrink-0"></i>
            <div>
              <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">门票价格</p>
              <p id="modal-fee" class="text-base font-medium text-slate-700 mt-1"></p>
            </div>
          </div>
        </div>

        <!-- Description Box -->
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">景点介绍</p>
          <p id="modal-description" class="text-slate-600 text-sm sm:text-base leading-relaxed bg-slate-50/50 p-4 rounded-xl border border-slate-100/60"></p>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="bg-slate-50 p-4 sm:p-5 border-t flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
        <div class="flex items-center gap-2 flex-wrap">
          <select id="modal-add-day" class="px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20"></select>
          <button onclick="addLocationToDay()" class="px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-medium transition whitespace-nowrap">
            <i class="fa-solid fa-plus mr-1"></i>加入行程
          </button>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="editCurrentLocation()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-sm font-medium transition">
            <i class="fa-solid fa-pen mr-1"></i>编辑景点
          </button>
          <button onclick="deleteCurrentLocation()" class="px-4 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-sm font-medium transition">
            <i class="fa-solid fa-trash mr-1"></i>删除
          </button>
          <button onclick="closeModal()" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-medium transition">
            关闭
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Location Add / Edit Modal -->
  <div id="location-edit-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden transform transition-all flex flex-col max-h-[92vh]">
      <div class="bg-slate-900 text-white p-6 relative">
        <button onclick="closeLocationEditModal()" class="absolute right-5 top-5 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-full w-9 h-9 flex items-center justify-center transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <h3 id="loc-edit-title" class="text-xl font-bold">添加新景点</h3>
      </div>
      
      <form id="loc-edit-form" onsubmit="saveLocationForm(event)" class="p-6 space-y-4 overflow-y-auto flex-1">
        <input type="hidden" id="loc-id">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">景点名称 *</label>
            <input type="text" id="loc-name" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">城市 *</label>
            <input type="text" id="loc-city" required placeholder="重庆 / 成都" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">分类 *</label>
            <input type="text" id="loc-category" required placeholder="如：地标、博物馆、公园" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">图片文件夹路径</label>
            <input type="text" id="loc-folder" placeholder="images/cq/hyd" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">详细地址 *</label>
          <input type="text" id="loc-address" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">开放/营业时间</label>
            <input type="text" id="loc-time" placeholder="09:00 - 22:00" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">门票价格</label>
            <input type="text" id="loc-fee" placeholder="免费 / 30元/人" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">景点介绍 *</label>
          <textarea id="loc-description" rows="3" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">纬度 (Latitude)</label>
            <input type="number" step="0.0001" id="loc-lat" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">经度 (Longitude)</label>
            <input type="number" step="0.0001" id="loc-lng" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
          </div>
        </div>

        <div class="pt-4 border-t flex justify-end gap-3">
          <button type="button" onclick="closeLocationEditModal()" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-medium transition">取消</button>
          <button type="submit" class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-medium transition">保存景点</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Interactive Lightbox Modal -->
  <div id="lightbox-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 select-none">
    <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white/70 hover:text-white text-3xl font-bold p-3 z-30 transition">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <button id="lightbox-prev" onclick="changeLightboxSlide(-1)" class="absolute left-3 sm:left-6 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white rounded-full w-12 h-12 flex items-center justify-center text-xl transition z-30 border border-white/10 shadow-lg">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button id="lightbox-next" onclick="changeLightboxSlide(1)" class="absolute right-3 sm:right-6 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white rounded-full w-12 h-12 flex items-center justify-center text-xl transition z-30 border border-white/10 shadow-lg">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
    <div class="relative max-w-full max-h-[90vh] flex flex-col items-center justify-center">
      <img id="lightbox-img" src="" alt="Preview" onclick="changeLightboxSlide(1)" title="点击查看下一张" class="max-w-full max-h-[82vh] object-contain rounded-lg shadow-2xl cursor-pointer">
      <div class="flex items-center gap-3 mt-3">
        <span id="lightbox-counter" class="text-white/90 text-xs font-mono bg-white/10 px-3 py-1 rounded-full backdrop-blur-md border border-white/10"></span>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2 rounded-xl shadow-lg z-[60]"></div>

  <!-- JavaScript Logic -->
  <script>
    const LOCATIONS_STORAGE_KEY = 'cq_cd_locations_v2';
    const ITINERARY_STORAGE_KEY = 'cq_cd_itinerary_v2';

    let appData = { locations: [], itinerary: [] };
    let originalLocations = [];
    let originalItinerary = [];

    let currentCategory = 'all';
    let currentCity = 'all';
    let searchQuery = '';
    
    let currentGalleryPhotos = [];
    let currentLightboxIndex = 0;
    let currentModalId = null;

    // Load data with localStorage fallback
    async function loadData() {
      try {
        const response = await fetch('./locations.json');
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        
        originalLocations = JSON.parse(JSON.stringify(data.locations || []));
        originalItinerary = normalizeItinerary(data.itinerary || []);

        let loadedLocations = originalLocations;
        let loadedItinerary = originalItinerary;

        try {
          const savedLocs = localStorage.getItem(LOCATIONS_STORAGE_KEY);
          if (savedLocs) loadedLocations = JSON.parse(savedLocs);
        } catch (e) {}

        try {
          const savedItin = localStorage.getItem(ITINERARY_STORAGE_KEY);
          if (savedItin) loadedItinerary = normalizeItinerary(JSON.parse(savedItin));
        } catch (e) {}

        appData = { locations: loadedLocations, itinerary: loadedItinerary };
        prepareItinerary();
        initApp();
      } catch (error) {
        console.error("Error loading json:", error);
        document.getElementById('locations-grid').innerHTML = `
          <div class="col-span-full p-6 bg-red-50 text-red-700 rounded-2xl border border-red-200 text-center">
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
            <p class="font-bold">无法加载数据 (locations.json)</p>
            <p class="text-xs mt-1 text-red-600 font-mono">${error.message}</p>
          </div>`;
      }
    }

    function initApp() {
      setupCityFilters();
      setupCategoryFilters();
      renderLocations();
      renderItinerary();
    }

    function persistLocations() {
      try {
        localStorage.setItem(LOCATIONS_STORAGE_KEY, JSON.stringify(appData.locations));
        showGlobalStatus('景点数据已保存');
      } catch (e) {
        showGlobalStatus('保存失败（超出存储配额）');
      }
    }

    function persistItinerary() {
      try {
        localStorage.setItem(ITINERARY_STORAGE_KEY, JSON.stringify(serializeItinerary()));
        const el = document.getElementById('save-status');
        if (el) el.innerHTML = '<i class="fa-solid fa-check text-green-500 mr-1"></i>已自动保存';
        showGlobalStatus('行程已保存');
      } catch (e) {}
    }

    function showGlobalStatus(msg) {
      const el = document.getElementById('global-save-status');
      if (el) {
        el.textContent = msg;
        setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 3000);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.add('hidden'), 1800);
    }

    // Navigation Tab Switcher
    function switchTab(tab) {
      const isLoc = tab === 'locations';
      document.getElementById('view-locations').classList.toggle('hidden', !isLoc);
      document.getElementById('view-itinerary').classList.toggle('hidden', isLoc);
      
      document.getElementById('nav-locations').className = isLoc 
        ? 'px-5 py-2 text-sm font-medium rounded-lg transition-all flex items-center gap-2 bg-white text-red-600 shadow-sm'
        : 'px-5 py-2 text-sm font-medium rounded-lg transition-all flex items-center gap-2 text-white hover:text-rose-100';
      
      document.getElementById('nav-itinerary').className = !isLoc 
        ? 'px-5 py-2 text-sm font-medium rounded-lg transition-all flex items-center gap-2 bg-white text-red-600 shadow-sm'
        : 'px-5 py-2 text-sm font-medium rounded-lg transition-all flex items-center gap-2 text-white hover:text-rose-100';
      
      if (!isLoc) renderItinerary();
      else renderLocations();
    }

    // Setup City Filters
    function setupCityFilters() {
      const cities = ['all', ...new Set(appData.locations.map(loc => loc.city))];
      const container = document.getElementById('city-filters');
      if (!container) return;
      
      container.innerHTML = cities.map(city => {
        const isAll = city === 'all';
        const label = isAll ? '全部城市' : city;
        return `
          <button onclick="setCity('${city}')" data-city="${city}"
            class="city-btn px-3.5 py-1.5 text-xs font-medium rounded-xl transition ${isAll && currentCity === 'all' ? 'bg-slate-800 text-white shadow-sm' : (currentCity === city ? 'bg-slate-800 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200')}">
            ${label}
          </button>
        `;
      }).join('');
    }

    function setCity(city) {
      currentCity = city;
      setupCityFilters();
      filterLocations();
    }

    // Setup Category Buttons
    function setupCategoryFilters() {
      const categories = ['all', ...new Set(appData.locations.map(loc => loc.category))];
      const container = document.getElementById('category-filters');
      if (!container) return;
      
      container.innerHTML = categories.map(cat => {
        const isAll = cat === 'all';
        const label = isAll ? '全部景点' : cat;
        return `
          <button onclick="setCategory('${cat}')" data-cat="${cat}"
            class="cat-btn px-3.5 py-1.5 text-xs font-medium rounded-xl transition ${currentCategory === cat ? 'bg-red-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
            ${label}
          </button>
        `;
      }).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      setupCategoryFilters();
      filterLocations();
    }

    function filterLocations() {
      searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      renderLocations();
    }

    function handleCoverError(img, fallbackPath) {
      if (!img.dataset.triedJpeg) {
        img.dataset.triedJpeg = "true";
        img.src = fallbackPath;
      } else {
        const parent = img.parentElement;
        parent.innerHTML = `
          <div class="w-full h-44 bg-gradient-to-br from-slate-100 to-slate-200 flex flex-col items-center justify-center text-slate-400">
            <i class="fa-solid fa-image text-3xl mb-1"></i>
            <span class="text-[10px] tracking-wide uppercase">暂无封面照片</span>
          </div>`;
      }
    }

    // Render Location Cards
    function renderLocations() {
      const grid = document.getElementById('locations-grid');
      const emptyState = document.getElementById('no-locations');

      const filtered = appData.locations.filter(loc => {
        const matchesCity = currentCity === 'all' || loc.city === currentCity;
        const matchesCategory = currentCategory === 'all' || loc.category === currentCategory;
        const matchesSearch = loc.name.toLowerCase().includes(searchQuery) ||
                              loc.address.toLowerCase().includes(searchQuery) ||
                              loc.city.toLowerCase().includes(searchQuery) ||
                              loc.description.toLowerCase().includes(searchQuery);
        return matchesCity && matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.innerHTML = filtered.map(loc => {
        const primaryImg = `${loc.folder || 'images/cq/hyd'}/img1.jpg`;
        const fallbackImg = `${loc.folder || 'images/cq/hyd'}/img1.jpeg`;

        return `
          <div onclick="openModal('${loc.id}')" 
            class="group bg-white rounded-2xl shadow-sm hover:shadow-xl border border-slate-100 hover:border-red-100 transition-all duration-300 cursor-pointer flex flex-col overflow-hidden">
            
            <div class="relative w-full h-44 bg-slate-100 overflow-hidden">
              <img src="${primaryImg}" 
                   onerror="handleCoverError(this, '${fallbackImg}')" 
                   alt="${loc.name}" 
                   class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
              <div class="absolute top-3 left-3">
                <span class="bg-red-600/90 text-white text-xs font-semibold px-2.5 py-1 rounded-lg backdrop-blur-md shadow-sm">
                  ${esc(loc.category)}
                </span>
              </div>
            </div>

            <div class="p-5 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <h3 class="text-lg font-bold text-slate-800 group-hover:text-red-600 transition-colors line-clamp-1">
                    ${esc(loc.name)}
                  </h3>
                  <span class="text-xs text-slate-400 font-medium shrink-0 ml-2"><i class="fa-solid fa-city mr-1"></i>${esc(loc.city)}</span>
                </div>
                
                <p class="text-xs text-slate-500 line-clamp-2 mb-4 leading-relaxed">
                  ${esc(loc.description)}
                </p>
              </div>

              <div class="pt-3 border-t border-slate-50 flex items-center justify-between text-xs text-slate-400">
                <span class="truncate max-w-[200px]"><i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${esc(loc.address)}</span>
                <span class="text-red-500 font-medium group-hover:translate-x-1 transition-transform flex items-center gap-1 shrink-0">
                  详情 <i class="fa-solid fa-arrow-right"></i>
                </span>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    // ===================== Location Add / Edit Modal Logic =====================
    function openLocationEditModal(id = null) {
      const isEdit = id != null;
      document.getElementById('loc-edit-title').textContent = isEdit ? '编辑景点' : '添加新景点';
      
      if (isEdit) {
        const loc = appData.locations.find(l => l.id === id);
        if (!loc) return;
        document.getElementById('loc-id').value = loc.id;
        document.getElementById('loc-name').value = loc.name || '';
        document.getElementById('loc-city').value = loc.city || '';
        document.getElementById('loc-category').value = loc.category || '';
        document.getElementById('loc-folder').value = loc.folder || '';
        document.getElementById('loc-address').value = loc.address || '';
        document.getElementById('loc-time').value = loc.operation_time || '';
        document.getElementById('loc-fee').value = loc.entrance_fee || '';
        document.getElementById('loc-description').value = loc.description || '';
        document.getElementById('loc-lat').value = loc.latitude || '';
        document.getElementById('loc-lng').value = loc.longitude || '';
      } else {
        document.getElementById('loc-edit-form').reset();
        document.getElementById('loc-id').value = '';
        document.getElementById('loc-folder').value = 'images/cq/custom';
      }
      document.getElementById('location-edit-modal').classList.remove('hidden');
    }

    function closeLocationEditModal() {
      document.getElementById('location-edit-modal').classList.add('hidden');
    }

    function saveLocationForm(e) {
      e.preventDefault();
      const idVal = document.getElementById('loc-id').value;
      const name = document.getElementById('loc-name').value.trim();
      const city = document.getElementById('loc-city').value.trim();
      const category = document.getElementById('loc-category').value.trim();
      const folder = document.getElementById('loc-folder').value.trim() || 'images/cq/custom';
      const address = document.getElementById('loc-address').value.trim();
      const operation_time = document.getElementById('loc-time').value.trim();
      const entrance_fee = document.getElementById('loc-fee').value.trim();
      const description = document.getElementById('loc-description').value.trim();
      const latitude = parseFloat(document.getElementById('loc-lat').value) || 29.5500;
      const longitude = parseFloat(document.getElementById('loc-lng').value) || 106.5000;

      if (idVal) {
        // Edit existing
        const idx = appData.locations.findIndex(l => l.id === idVal);
        if (idx !== -1) {
          appData.locations[idx] = {
            ...appData.locations[idx],
            name, city, category, folder, address, operation_time, entrance_fee, description, latitude, longitude
          };
          showToast(`已成功更新景点：${name}`);
        }
      } else {
        // Add new
        const newId = 'loc_' + Math.random().toString(36).substring(2, 9);
        const newLoc = {
          id: newId,
          name, city, category, folder, address, operation_time, entrance_fee, description, latitude, longitude
        };
        appData.locations.push(newLoc);
        showToast(`已成功添加景点：${name}`);
      }

      persistLocations();
      closeLocationEditModal();
      setupCityFilters();
      setupCategoryFilters();
      renderLocations();
      renderItinerary();
      
      // If modal detail view was open, refresh detail modal if it's the same
      if (currentModalId === idVal) {
        openModal(idVal);
      }
    }

    function editCurrentLocation() {
      if (!currentModalId) return;
      closeModal();
      openLocationEditModal(currentModalId);
    }

    function deleteCurrentLocation() {
      if (!currentModalId) return;
      const loc = appData.locations.find(l => l.id === currentModalId);
      if (!loc) return;
      
      if (!confirm(`确定要删除景点「${loc.name}」吗？相关行程中的关联可能会失效。`)) return;

      appData.locations = appData.locations.filter(l => l.id !== currentModalId);
      persistLocations();
      closeModal();
      setupCityFilters();
      setupCategoryFilters();
      renderLocations();
      renderItinerary();
      showToast(`已删除景点：${loc.name}`);
    }

    // ===================== Itinerary Logic =====================
    const STEP_TYPES = ['POI', 'Food', 'Shopping', 'Experience', 'Transport', 'Hotel', 'Other'];
    let editMode = false;

    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function parseTitle(t) {
      const m = String(t || '').match(/^Day\s*\d+\s*(?:[（(]([^)）]*)[)）])?\s*[:：]?\s*(.*)$/);
      return m ? { date: m[1] || '', name: m[2] || '' } : { date: '', name: t || '' };
    }

    function normalizeItinerary(list) {
      return (list || []).map(d => {
        const p = parseTitle(d.title);
        return {
          city: d.city || '',
          date: d.date != null ? d.date : p.date,
          name: d.name != null ? d.name : p.name,
          steps: (d.steps || []).map(st => ({
            time: st.time || '',
            type: st.type || 'POI',
            activity: st.activity || '',
            locationId: st.locationId || '',
            notes: st.notes || ''
          }))
        };
      });
    }

    function serializeItinerary() {
      return appData.itinerary.map((d, i) => ({
        day: i + 1,
        title: `Day ${i + 1}${d.date ? ` (${d.date})` : ''}: ${d.name}`,
        city: d.city,
        steps: d.steps.map(st => {
          const o = { time: st.time, activity: st.activity, type: st.type };
          if (st.locationId) o.locationId = st.locationId;
          if (st.notes) o.notes = st.notes;
          return o;
        })
      }));
    }

    function prepareItinerary() {
      let list = originalItinerary;
      try {
        const saved = localStorage.getItem(ITINERARY_STORAGE_KEY);
        if (saved) list = normalizeItinerary(JSON.parse(saved));
      } catch (e) {}
      appData.itinerary = JSON.parse(JSON.stringify(list));
    }

    function getLoc(id) { return appData.locations.find(l => l.id === id); }

    function locationOptions(selectedId) {
      const cities = [...new Set(appData.locations.map(l => l.city))];
      let html = `<option value="">（不关联景点 / 自定义）</option>`;
      let found = !selectedId;
      cities.forEach(city => {
        html += `<optgroup label="${esc(city)}">` + appData.locations.filter(l => l.city === city).map(l => {
          if (l.id === selectedId) found = true;
          return `<option value="${esc(l.id)}" ${l.id === selectedId ? 'selected' : ''}>${esc(l.name)}</option>`;
        }).join('') + `</optgroup>`;
      });
      if (!found) html += `<option value="${esc(selectedId)}" selected>（未知景点：${esc(selectedId)}）</option>`;
      return html;
    }

    function toggleEdit() {
      editMode = !editMode;
      document.getElementById('edit-tools').classList.toggle('hidden', !editMode);
      document.getElementById('add-day-btn').classList.toggle('hidden', !editMode);
      const btn = document.getElementById('edit-toggle');
      btn.innerHTML = editMode
        ? '<i class="fa-solid fa-check mr-1"></i> 完成编辑'
        : '<i class="fa-solid fa-pen-to-square mr-1"></i> 编辑行程';
      btn.className = editMode
        ? 'text-sm bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg transition font-medium'
        : 'text-sm bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg transition font-medium';
      document.getElementById('itinerary-hint').textContent = editMode
        ? '修改会自动保存在本机浏览器。可调整顺序、更换景点、增删行程。'
        : '点击「查看景点详情」可查看景点信息；点「编辑行程」可自由修改。';
      renderItinerary();
    }

    function updDay(di, key, val) { appData.itinerary[di][key] = val; persistItinerary(); }
    function updStep(di, si, key, val) { appData.itinerary[di].steps[si][key] = val; persistItinerary(); }

    function setStepLocation(di, si, id) {
      const st = appData.itinerary[di].steps[si];
      const prev = getLoc(st.locationId);
      const next = getLoc(id);
      st.locationId = id;
      if (next && (!st.activity || (prev && st.activity === prev.name))) st.activity = next.name;
      persistItinerary();
      renderItinerary();
    }

    function moveStep(di, si, dir) {
      const steps = appData.itinerary[di].steps;
      const j = si + dir;
      if (j < 0 || j >= steps.length) return;
      [steps[si], steps[j]] = [steps[j], steps[si]];
      persistItinerary(); renderItinerary();
    }

    function deleteStep(di, si) {
      appData.itinerary[di].steps.splice(si, 1);
      persistItinerary(); renderItinerary();
    }

    function nextTime(steps) {
      if (!steps.length || !/^\d{1,2}:\d{2}$/.test(steps[steps.length - 1].time)) return '09:00';
      const [h, m] = steps[steps.length - 1].time.split(':').map(Number);
      return String(Math.min(h + 1, 23)).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    }

    function addStep(di) {
      const steps = appData.itinerary[di].steps;
      steps.push({ time: nextTime(steps), type: 'POI', activity: '', locationId: '', notes: '' });
      persistItinerary(); renderItinerary();
    }

    function sortSteps(di) {
      appData.itinerary[di].steps.sort((a, b) => a.time.localeCompare(b.time));
      persistItinerary(); renderItinerary();
    }

    function addDay() {
      const list = appData.itinerary;
      list.push({ city: list.length ? list[list.length - 1].city : '', date: '', name: '新的一天', steps: [] });
      persistItinerary(); renderItinerary();
    }

    function moveDay(di, dir) {
      const list = appData.itinerary;
      const j = di + dir;
      if (j < 0 || j >= list.length) return;
      [list[di], list[j]] = [list[j], list[di]];
      persistItinerary(); renderItinerary();
    }

    function deleteDay(di) {
      if (!confirm(`确定删除 Day ${di + 1} 整天的行程吗？`)) return;
      appData.itinerary.splice(di, 1);
      persistItinerary(); renderItinerary();
    }

    function addLocationToDay() {
      const di = parseInt(document.getElementById('modal-add-day').value, 10);
      const loc = getLoc(currentModalId);
      if (!loc || isNaN(di) || !appData.itinerary[di]) return;
      const steps = appData.itinerary[di].steps;
      const isFood = /美食|小吃|餐|火锅/.test(loc.category);
      steps.push({ time: nextTime(steps), type: isFood ? 'Food' : 'POI', activity: loc.name, locationId: loc.id, notes: '' });
      persistItinerary();
      showToast(`已加入 Day ${di + 1}：${loc.name}`);
    }

    // ---- Export / Import / Reset ----
    function exportData() {
      const exportObj = {
        locations: appData.locations,
        itinerary: serializeItinerary()
      };
      const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'cq_cd_trip_data.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      showToast('导出成功');
    }

    function importData(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.locations && Array.isArray(data.locations)) {
            appData.locations = data.locations;
            persistLocations();
          }
          const list = Array.isArray(data) ? data : data.itinerary;
          if (list && Array.isArray(list)) {
            appData.itinerary = normalizeItinerary(list);
            persistItinerary();
          }
          initApp();
          showToast('数据导入成功');
        } catch (e) { alert('导入失败：文件格式不正确'); }
        ev.target.value = '';
      };
      reader.readAsText(file);
    }

    function resetItinerary() {
      if (!confirm('确定放弃所有修改，恢复为原始行程吗？')) return;
      appData.itinerary = JSON.parse(JSON.stringify(originalItinerary));
      try { localStorage.removeItem(ITINERARY_STORAGE_KEY); } catch (e) {}
      document.getElementById('save-status').textContent = '';
      renderItinerary();
      showToast('已恢复原始行程');
    }

    function resetAllData() {
      if (!confirm('确定要恢复所有景点和行程为初始状态吗？您自定义添加的景点和修改将会被清除。')) return;
      appData.locations = JSON.parse(JSON.stringify(originalLocations));
      appData.itinerary = JSON.parse(JSON.stringify(originalItinerary));
      localStorage.removeItem(LOCATIONS_STORAGE_KEY);
      localStorage.removeItem(ITINERARY_STORAGE_KEY);
      initApp();
      showToast('已完全恢复初始默认数据');
    }

    // ---- Rendering Itinerary ----
    const iconBtn = 'w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-slate-200 text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition text-xs disabled:opacity-30';
    const inputCls = 'px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500';

    function renderItinerary() {
      const container = document.getElementById('itinerary-container');
      const days = appData.itinerary;
      if (!days.length) {
        container.innerHTML = `<div class="text-center py-12 bg-white rounded-2xl border border-slate-100 text-slate-400 text-sm">还没有行程，点下方「添加一天」开始吧</div>`;
        return;
      }
      container.innerHTML = days.map((day, di) => editMode ? renderDayEdit(day, di, days.length) : renderDayView(day, di)).join('');
    }

    function renderDayView(day, di) {
      return `
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
          <div class="flex items-center gap-3 pb-4 mb-6 border-b border-slate-100">
            <div class="bg-red-600 text-white font-bold px-3 py-1.5 rounded-xl text-sm shrink-0">Day ${di + 1}</div>
            <h3 class="text-lg font-bold text-slate-800">${day.date ? `<span class="text-slate-400 font-medium">${esc(day.date)}</span> ` : ''}${esc(day.name)}</h3>
          </div>
          <div class="relative pl-6 border-l-2 border-slate-100 space-y-6">
            ${day.steps.length ? day.steps.map(step => `
              <div class="relative group">
                <div class="absolute -left-[31px] top-1.5 w-4 h-4 rounded-full bg-white border-4 border-red-500"></div>
                <div class="bg-slate-50 hover:bg-slate-100/80 rounded-xl p-4 transition border border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div class="space-y-1">
                    <div class="flex items-center gap-2">
                      <span class="font-mono text-xs font-semibold bg-slate-200 text-slate-700 px-2 py-0.5 rounded">${esc(step.time)}</span>
                      <span class="text-xs text-slate-400 px-2 py-0.5 rounded bg-white border">${esc(step.type)}</span>
                    </div>
                    <h4 class="font-bold text-slate-800 text-base">${esc(step.activity)}</h4>${step.notes ? `<p class="text-xs text-slate-500"><i class="fa-regular fa-lightbulb text-amber-500 mr-1"></i>${esc(step.notes)}</p>` : ''}
                  </div>
                  ${step.locationId ? `
                    <button onclick="openModal('${esc(step.locationId)}')"
                      class="self-start sm:self-center bg-white hover:bg-red-50 text-red-600 hover:text-red-700 border border-red-200 px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center gap-1.5 shadow-sm whitespace-nowrap">
                      <i class="fa-solid fa-circle-info"></i> 查看景点详情
                    </button>` : ''}
                </div>
              </div>`).join('') : `<p class="text-sm text-slate-400">这一天还没有安排</p>`}
          </div>
        </div>`;
    }

    function renderDayEdit(day, di, total) {
      return `
        <div class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border-2 border-red-100">
          <div class="flex flex-wrap items-center gap-2 pb-4 mb-4 border-b border-slate-100">
            <div class="bg-red-600 text-white font-bold px-3 py-1.5 rounded-xl text-sm shrink-0">Day ${di + 1}</div>
            <input type="text" value="${esc(day.date)}" placeholder="日期，如 11月7日" oninput="updDay(${di},'date',this.value)" class="${inputCls} w-32">
            <input type="text" value="${esc(day.name)}" placeholder="当天主题" oninput="updDay(${di},'name',this.value)" class="${inputCls} flex-1 min-w-[10rem]">
            <div class="flex gap-1 ml-auto">
              <button onclick="moveDay(${di},-1)" class="${iconBtn}" ${di === 0 ? 'disabled' : ''} title="上移一天"><i class="fa-solid fa-arrow-up"></i></button>
              <button onclick="moveDay(${di},1)" class="${iconBtn}" ${di === total - 1 ? 'disabled' : ''} title="下移一天"><i class="fa-solid fa-arrow-down"></i></button>
              <button onclick="deleteDay(${di})" class="${iconBtn} hover:!text-red-600 hover:!bg-red-50" title="删除这一天"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>

          <div class="space-y-3">
            ${day.steps.map((st, si) => `
              <div class="bg-slate-50 rounded-xl p-3 border border-slate-100 space-y-2">
                <div class="flex flex-wrap items-center gap-2">
                  <input type="time" value="${esc(st.time)}" oninput="updStep(${di},${si},'time',this.value)" class="${inputCls} w-28">
                  <select onchange="updStep(${di},${si},'type',this.value)" class="${inputCls}">
                    ${(STEP_TYPES.includes(st.type) ? STEP_TYPES : [...STEP_TYPES, st.type]).map(t => `<option value="${esc(t)}" ${t === st.type ? 'selected' : ''}>${esc(t)}</option>`).join('')}
                  </select>
                  <div class="flex gap-1 ml-auto">
                    <button onclick="moveStep(${di},${si},-1)" class="${iconBtn}" ${si === 0 ? 'disabled' : ''} title="上移"><i class="fa-solid fa-arrow-up"></i></button>
                    <button onclick="moveStep(${di},${si},1)" class="${iconBtn}" ${si === day.steps.length - 1 ? 'disabled' : ''} title="下移"><i class="fa-solid fa-arrow-down"></i></button>
                    <button onclick="deleteStep(${di},${si})" class="${iconBtn} hover:!text-red-600 hover:!bg-red-50" title="删除"><i class="fa-solid fa-trash"></i></button>
                  </div>
                </div>
                <select onchange="setStepLocation(${di},${si},this.value)" class="${inputCls} w-full">${locationOptions(st.locationId)}</select>
                <input type="text" value="${esc(st.activity)}" placeholder="活动名称" oninput="updStep(${di},${si},'activity',this.value)" class="${inputCls} w-full font-medium">
                <input type="text" value="${esc(st.notes)}" placeholder="备注（可选）" oninput="updStep(${di},${si},'notes',this.value)" class="${inputCls} w-full">
                ${st.locationId ? `<button onclick="openModal('${esc(st.locationId)}')" class="text-xs text-red-600 hover:underline"><i class="fa-solid fa-circle-info mr-1"></i>查看景点详情</button>` : ''}
              </div>`).join('')}
          </div>

          <div class="flex flex-wrap gap-2 mt-4">
            <button onclick="addStep(${di})" class="text-xs px-3 py-2 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 font-medium transition"><i class="fa-solid fa-plus mr-1"></i>添加活动</button>
            <button onclick="sortSteps(${di})" class="text-xs px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 transition"><i class="fa-solid fa-arrow-down-1-9 mr-1"></i>按时间排序</button>
          </div>
        </div>`;
    }

    // ===================== Detail Modal & Gallery =====================
    async function openModal(id) {
      const loc = appData.locations.find(item => item.id === id);
      if (!loc) { alert("未找到该景点的详细数据"); return; }

      document.getElementById('modal-name').innerText = loc.name;
      currentModalId = id;
      document.getElementById('modal-add-day').innerHTML = appData.itinerary.length
        ? appData.itinerary.map((d, i) => `<option value="${i}">Day ${i + 1}${d.date ? ' · ' + esc(d.date) : ''}</option>`).join('')
        : '<option value="" disabled selected>暂无行程</option>';
      document.getElementById('modal-category').innerText = loc.category;
      document.getElementById('modal-city').innerText = loc.city;
      document.getElementById('modal-address').innerText = loc.address;
      document.getElementById('modal-description').innerText = loc.description;

      const timeBox = document.getElementById('modal-time-box');
      if (loc.operation_time && loc.operation_time.trim() !== '') {
        document.getElementById('modal-time').innerText = loc.operation_time;
        timeBox.classList.remove('hidden');
      } else {
        timeBox.classList.add('hidden');
      }

      const feeBox = document.getElementById('modal-fee-box');
      if (loc.entrance_fee && loc.entrance_fee.trim() !== '') {
        document.getElementById('modal-fee').innerText = loc.entrance_fee;
        feeBox.classList.remove('hidden');
      } else {
        feeBox.classList.add('hidden');
      }

      document.getElementById('location-modal').classList.remove('hidden');
      await loadGalleryPhotos(loc);
    }

    function closeModal() {
      document.getElementById('location-modal').classList.add('hidden');
      currentModalId = null;
    }

    async function checkImageExists(url) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(url);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    async function loadGalleryPhotos(loc) {
      const galleryContainer = document.getElementById('gallery-container');
      const noMsg = document.getElementById('no-gallery-msg');

      galleryContainer.innerHTML = `
        <div class="col-span-full py-8 text-center text-slate-400 text-xs">
          <i class="fa-solid fa-spinner fa-spin text-lg mb-1"></i> 正在加载图库...
        </div>`;
      noMsg.classList.add('hidden');

      const folder = loc.folder || 'images/cq/hyd';
      const maxCount = 6;
      let foundList = [];

      const promises = [];
      for (let i = 1; i <= maxCount; i++) {
        promises.push(checkImageExists(`${folder}/img${i}.jpg`));
        promises.push(checkImageExists(`${folder}/img${i}.jpeg`));
      }

      const results = await Promise.all(promises);
      foundList = [...new Set(results.filter(Boolean))];

      if (foundList.length === 0) {
        galleryContainer.innerHTML = '';
        noMsg.classList.remove('hidden');
        currentGalleryPhotos = [];
        return;
      }

      currentGalleryPhotos = foundList;
      galleryContainer.innerHTML = foundList.map((url, idx) => `
        <div onclick="openLightbox(${idx})" class="relative group aspect-[4/3] rounded-xl bg-slate-100 overflow-hidden cursor-pointer border border-slate-200/60 shadow-sm">
          <img src="${url}" alt="${loc.name} - 图${idx+1}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs gap-1">
            <i class="fa-solid fa-magnifying-glass-plus"></i> 查看大图
          </div>
        </div>
      `).join('');
    }

    // Lightbox Controls
    function openLightbox(index) {
      if (!currentGalleryPhotos.length) return;
      currentLightboxIndex = index;
      updateLightboxImage();
      document.getElementById('lightbox-modal').classList.remove('hidden');
      document.addEventListener('keydown', handleLightboxKeydown);
    }

    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.add('hidden');
      document.removeEventListener('keydown', handleLightboxKeydown);
    }

    function changeLightboxSlide(direction) {
      if (!currentGalleryPhotos.length) return;
      currentLightboxIndex = (currentLightboxIndex + direction + currentGalleryPhotos.length) % currentGalleryPhotos.length;
      updateLightboxImage();
    }

    function updateLightboxImage() {
      const img = document.getElementById('lightbox-img');
      const counter = document.getElementById('lightbox-counter');
      img.src = currentGalleryPhotos[currentLightboxIndex];
      counter.textContent = `${currentLightboxIndex + 1} / ${currentGalleryPhotos.length}`;
    }

    function handleLightboxKeydown(e) {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') changeLightboxSlide(1);
      if (e.key === 'ArrowLeft') changeLightboxSlide(-1);
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
