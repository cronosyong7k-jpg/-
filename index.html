<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>成渝行指南 - 相册与行程</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb' }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-4 py-2.5 shadow-sm">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      
      <div class="flex items-center justify-between w-full sm:w-auto">
        <div class="flex items-center space-x-2">
          <div class="bg-gradient-to-tr from-red-500 to-amber-500 text-white p-2 rounded-xl shadow-md">
            <i class="fa-solid fa-map-location-dot text-base"></i>
          </div>
          <div>
            <h1 class="font-bold text-base leading-tight">成渝行指南</h1>
            <p class="text-[11px] text-slate-500 dark:text-slate-400">景点相册与行程路线</p>
          </div>
        </div>

        <div class="flex items-center gap-2 sm:hidden">
          <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
            <i class="fa-solid fa-moon dark:hidden"></i>
            <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
          </button>
          <button onclick="openJsonModal()" class="p-2 rounded-xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900">
            <i class="fa-solid fa-code"></i>
          </button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex items-center justify-between w-full sm:w-auto gap-4">
        <nav class="flex items-center bg-slate-100 dark:bg-slate-700/70 p-1 rounded-xl w-full sm:w-auto">
          <button id="tabLocations" onclick="switchTab('locations')" class="flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5 bg-white dark:bg-slate-800 text-red-500 shadow-sm">
            <i class="fa-solid fa-images"></i>
            <span>景点相册</span>
          </button>
          <button id="tabItinerary" onclick="switchTab('itinerary')" class="flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5 text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-route"></i>
            <span>行程路线</span>
          </button>
        </nav>

        <div class="hidden sm:flex items-center gap-2">
          <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
            <i class="fa-solid fa-moon dark:hidden"></i>
            <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
          </button>
          <button onclick="openJsonModal()" class="px-3 py-1.5 rounded-xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 font-medium text-xs shadow">
            <i class="fa-solid fa-code mr-1"></i> JSON 设置
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- Page 1: Locations Gallery View -->
  <main id="locationsPage" class="flex-grow max-w-5xl w-full mx-auto px-4 py-4 space-y-4">
    <!-- Filters Card -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/80 space-y-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="搜索景点或描述..." class="w-full pl-10 pr-10 py-2 bg-slate-100 dark:bg-slate-700/60 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>

      <div class="flex items-center gap-2 pt-1">
        <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 shrink-0"><i class="fa-solid fa-city mr-1"></i>城市:</span>
        <div id="cityFilterContainer" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
      </div>

      <div class="space-y-1.5 pt-1 border-t border-slate-100 dark:border-slate-700/50">
        <span class="text-xs font-semibold text-slate-500 dark:text-slate-400"><i class="fa-solid fa-tags mr-1"></i>分类:</span>
        <div id="categoryFilterContainer" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1"></div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="flex items-center justify-between text-xs text-slate-500 px-1">
      <div>共找到 <span id="locationCount" class="font-bold text-red-600 dark:text-red-400">0</span> 个景点</div>
      <button onclick="forceResetData()" class="text-xs text-red-500 hover:underline flex items-center gap-1">
        <i class="fa-solid fa-rotate-right"></i> 强制重置数据
      </button>
    </div>

    <!-- Grid -->
    <div id="locationGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <!-- Page 2: Itinerary Timeline View -->
  <main id="itineraryPage" class="hidden flex-grow max-w-4xl w-full mx-auto px-4 py-4 space-y-6">
    <div class="bg-gradient-to-r from-red-500 to-amber-500 rounded-2xl p-4 text-white shadow-md">
      <h2 class="font-bold text-lg flex items-center gap-2">
        <i class="fa-solid fa-calendar-days"></i> 成渝10日游推荐行程 (11月7日 - 11月16日)
      </h2>
      <p class="text-xs text-white/90 mt-1">跟着每日路线游玩，点击带有相机图标的项可直接查看景点照片。</p>
    </div>

    <div id="itineraryTimeline" class="space-y-6"></div>
  </main>

  <!-- Lightbox Modal -->
  <div id="lightboxModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4">
    <button onclick="closeLightbox()" class="absolute top-4 right-4 z-20 w-10 h-10 rounded-full bg-white/20 text-white flex items-center justify-center">
      <i class="fa-solid fa-xmark text-xl"></i>
    </button>
    <button onclick="navigateImage(-1)" class="absolute left-3 z-20 w-10 h-10 rounded-full bg-black/50 text-white flex items-center justify-center border border-white/20">
      <i class="fa-solid fa-chevron-left text-lg"></i>
    </button>
    <button onclick="navigateImage(1)" class="absolute right-3 z-20 w-10 h-10 rounded-full bg-black/50 text-white flex items-center justify-center border border-white/20">
      <i class="fa-solid fa-chevron-right text-lg"></i>
    </button>

    <div class="max-w-4xl w-full max-h-[90vh] flex flex-col items-center justify-center space-y-3">
      <img id="lightboxImage" src="" class="max-h-[72vh] w-auto max-w-full rounded-lg object-contain shadow-2xl">
      <div class="text-center text-white space-y-1">
        <div class="flex items-center justify-center gap-2">
          <h3 id="lightboxTitle" class="font-bold text-base"></h3>
          <span id="lightboxCounter" class="bg-white/20 text-xs px-2 py-0.5 rounded-full">1/1</span>
        </div>
      </div>
    </div>
  </div>

  <!-- JSON Config Modal -->
  <div id="jsonModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-5 py-3.5 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
        <h2 class="font-bold text-sm">编辑 JSON 数据</h2>
        <button onclick="closeJsonModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="p-4 flex-grow overflow-y-auto space-y-3">
        <textarea id="jsonTextArea" rows="12" class="w-full p-3 bg-slate-900 text-emerald-400 font-mono text-xs rounded-xl focus:outline-none"></textarea>
      </div>
      <div class="px-5 py-3 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between">
        <button onclick="forceResetData()" class="text-xs text-slate-500 hover:text-red-500">恢复默认</button>
        <button onclick="saveJsonModal()" class="px-4 py-1.5 bg-red-500 text-white text-xs font-medium rounded-xl shadow">保存应用</button>
      </div>
    </div>
  </div>

    let appData = FULL_DEFAULT_DATA;
    let selectedCity = '全部';
    let selectedCategories = new Set();
    let searchQuery = '';

    let activeImages = [];
    let activeImageIndex = 0;
    let activeTitle = '';

    function init() {
      // Force reset key v5 to bypass bad empty browser cache
      const stored = localStorage.getItem('chengdu_chongqing_v5');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (parsed && Array.isArray(parsed.locations) && parsed.locations.length > 0) {
            appData = parsed;
          } else {
            appData = FULL_DEFAULT_DATA;
          }
        } catch (e) {
          appData = FULL_DEFAULT_DATA;
        }
      } else {
        appData = FULL_DEFAULT_DATA;
      }

      saveData();
      renderAll();
    }

    function saveData() {
      localStorage.setItem('chengdu_chongqing_v5', JSON.stringify(appData));
    }

    function forceResetData() {
      localStorage.removeItem('chengdu_chongqing_v5');
      appData = FULL_DEFAULT_DATA;
      selectedCity = '全部';
      selectedCategories.clear();
      searchQuery = '';
      saveData();
      closeJsonModal();
      renderAll();
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    function switchTab(tabName) {
      const locPage = document.getElementById('locationsPage');
      const itiPage = document.getElementById('itineraryPage');
      const tabLoc = document.getElementById('tabLocations');
      const tabIti = document.getElementById('tabItinerary');

      if (tabName === 'locations') {
        locPage.classList.remove('hidden');
        itiPage.classList.add('hidden');
        tabLoc.className = 'flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5 bg-white dark:bg-slate-800 text-red-500 shadow-sm';
        tabIti.className = 'flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5 text-slate-500 dark:text-slate-400';
      } else {
        locPage.classList.add('hidden');
        itiPage.classList.remove('hidden');
        tabIti.className = 'flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5 bg-white dark:bg-slate-800 text-red-500 shadow-sm';
        tabLoc.className = 'flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5 text-slate-500 dark:text-slate-400';
      }
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      renderLocations();
    }

    function renderAll() {
      renderFilters();
      renderLocations();
      renderItinerary();
    }

    function renderFilters() {
      const locs = appData.locations || [];
      const cities = ['全部', ...new Set(locs.map(i => i.city || '其他'))];
      const cityBox = document.getElementById('cityFilterContainer');
      cityBox.innerHTML = cities.map(c => `
        <button onclick="setCity('${c}')" class="px-3 py-1 rounded-lg text-xs font-medium border shrink-0 ${selectedCity === c ? 'bg-red-500 text-white border-red-500' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border-transparent'}">${c}</button>
      `).join('');

      const categories = [...new Set(locs.map(i => i.category || '未分类'))];
      const catBox = document.getElementById('categoryFilterContainer');
      catBox.innerHTML = categories.map(cat => {
        const isSel = selectedCategories.has(cat);
        return `
          <button onclick="toggleCat('${cat}')" class="px-3 py-1 rounded-xl text-xs font-medium border shrink-0 ${isSel ? 'bg-amber-500 text-white border-amber-500' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}">
            <i class="fa-solid ${isSel ? 'fa-square-check' : 'fa-square'} mr-1"></i>${cat}
          </button>
        `;
      }).join('');
    }

    function setCity(c) { selectedCity = c; renderFilters(); renderLocations(); }
    function toggleCat(cat) {
      if (selectedCategories.has(cat)) selectedCategories.delete(cat);
      else selectedCategories.add(cat);
      renderFilters(); renderLocations();
    }

    function renderLocations() {
      const locs = appData.locations || [];
      const filtered = locs.filter(loc => {
        const matchesCity = selectedCity === '全部' || (loc.city || '其他') === selectedCity;
        const matchesCat = selectedCategories.size === 0 || selectedCategories.has(loc.category || '未分类');
        const matchesSearch = searchQuery === '' || (loc.name && loc.name.toLowerCase().includes(searchQuery)) || (loc.description && loc.description.toLowerCase().includes(searchQuery));
        return matchesCity && matchesCat && matchesSearch;
      });

      document.getElementById('locationCount').textContent = filtered.length;
      const grid = document.getElementById('locationGrid');

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 space-y-3">
            <p class="text-xs text-slate-400">未找到相关景点。</p>
            <button onclick="forceResetData()" class="px-4 py-1.5 bg-red-500 text-white text-xs rounded-xl shadow">重置数据</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const imgs = item.images && item.images.length > 0 ? item.images : ['https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=600'];
        return `
          <div class="bg-white dark:bg-slate-800 rounded-2xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col">
            <div class="relative h-44 bg-slate-100 cursor-pointer group" onclick="openPhotoById('${item.id}')">
              <img src="${imgs[0]}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
              <div class="absolute top-3 left-3 flex gap-1">
                ${item.city ? `<span class="px-2 py-0.5 bg-red-600 text-white text-[10px] font-bold rounded">${item.city}</span>` : ''}
                ${item.category ? `<span class="px-2 py-0.5 bg-black/50 text-white text-[10px] rounded">${item.category}</span>` : ''}
              </div>
              <div class="absolute bottom-3 left-3 text-white font-bold drop-shadow">${item.name}</div>
            </div>
            <div class="p-3 text-xs flex-grow flex flex-col justify-between space-y-2">
              <p class="text-slate-600 dark:text-slate-300 line-clamp-3">${item.description || ''}</p>
              <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700">
                <button onclick="openPhotoById('${item.id}')" class="text-xs text-red-500 font-medium">查看相册 (${imgs.length})</button>
                ${item.mapsUrl ? `<a href="${item.mapsUrl}" target="_blank" class="text-xs text-slate-500 hover:text-red-500">地图导航 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></a>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderItinerary() {
      const container = document.getElementById('itineraryTimeline');
      if (!appData.itinerary || appData.itinerary.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-8">暂无行程安排数据</p>';
        return;
      }

      const typePills = {
        'POI': 'bg-amber-100 text-amber-700 dark:bg-amber-900/50 dark:text-amber-300',
        'Food': 'bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-300',
        'Transport': 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300'
      };

      container.innerHTML = appData.itinerary.map(day => `
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
          <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100 border-b border-slate-100 dark:border-slate-700 pb-2">${day.title}</h3>
          <div class="space-y-3">
            ${day.items.map(item => {
              const linkedLoc = item.locationId ? (appData.locations || []).find(l => l.id === item.locationId) : null;
              return `
                <div class="flex items-start gap-3 text-xs">
                  <span class="font-mono text-slate-400 shrink-0 mt-0.5">${item.time}</span>
                  <div class="flex-grow space-y-1">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="font-medium text-slate-800 dark:text-slate-200">${item.activity}</span>
                      <span class="px-2 py-0.5 rounded text-[10px] ${typePills[item.type] \vert{}\vert{} 'bg-slate-100 text-slate-600'}">${item.type}</span>
                    </div>
                    ${item.notes ? `<p class="text-slate-500 text-[11px]">${item.notes}</p>` : ''}
                  </div>
                  ${linkedLoc ? `
                    <button onclick="openPhotoById('${linkedLoc.id}')" class="shrink-0 px-2 py-1 bg-red-50 dark:bg-red-950/50 text-red-500 rounded border border-red-100 dark:border-red-900 text-[11px] flex items-center gap-1">
                      <i class="fa-solid fa-camera"></i> 相册
                    </button>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    function openPhotoById(locId) {
      const loc = (appData.locations || []).find(l => l.id === locId);
      if (!loc) return;
      activeImages = loc.images && loc.images.length > 0 ? loc.images : [];
      activeImageIndex = 0;
      activeTitle = loc.name;
      updateLightbox();
      document.getElementById('lightboxModal').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.add('hidden');
    }

    function navigateImage(dir) {
      if (activeImages.length <= 1) return;
      activeImageIndex = (activeImageIndex + dir + activeImages.length) % activeImages.length;
      updateLightbox();
    }

    function updateLightbox() {
      document.getElementById('lightboxImage').src = activeImages[activeImageIndex] || '';
      document.getElementById('lightboxTitle').textContent = activeTitle;
      document.getElementById('lightboxCounter').textContent = `${activeImageIndex + 1}/${activeImages.length}`;
    }

    function openJsonModal() {
      document.getElementById('jsonTextArea').value = JSON.stringify(appData, null, 2);
      document.getElementById('jsonModal').classList.remove('hidden');
    }

    function closeJsonModal() {
      document.getElementById('jsonModal').classList.add('hidden');
    }

    function saveJsonModal() {
      try {
        appData = JSON.parse(document.getElementById('jsonTextArea').value);
        saveData();
        closeJsonModal();
        renderAll();
      } catch (e) {
        alert('JSON 格式错误: ' + e.message);
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
