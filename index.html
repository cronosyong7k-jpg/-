<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>成都与重庆之旅 - 照片相册</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- 顶部导航栏 -->
  <header class="sticky top-0 z-30 bg-white shadow-sm border-b px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="bg-red-600 text-white p-2 rounded-xl">
          <i class="fa-solid fa-plane-departure"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight">成都与重庆之旅</h1>
          <p class="text-[11px] text-slate-500">景点照片与行程浏览</p>
        </div>
      </div>
      <button onclick="clearAndReload()" class="px-2.5 py-1 text-xs bg-slate-100 text-slate-600 border border-slate-200 rounded-lg active:scale-95 transition">
        <i class="fa-solid fa-rotate-right mr-1"></i>刷新
      </button>
    </div>
  </header>

  <!-- 切换标签 -->
  <div class="bg-white border-b sticky top-[57px] z-20 shadow-xs">
    <div class="max-w-md mx-auto flex">
      <button id="tabLocBtn" onclick="switchTab('locations')" class="flex-1 py-2.5 text-center text-xs font-bold border-b-2 border-red-600 text-red-600">
        <i class="fa-solid fa-camera-retro mr-1"></i>景点列表
      </button>
      <button id="tabItinBtn" onclick="switchTab('itinerary')" class="flex-1 py-2.5 text-center text-xs font-bold text-slate-400 border-b-2 border-transparent">
        <i class="fa-solid fa-route mr-1"></i>行程安排
      </button>
    </div>
  </div>

  <!-- 主内容区 -->
  <main class="flex-grow max-w-md w-full mx-auto p-4 space-y-4">
    <!-- 视图 1：景点列表 -->
    <div id="locationsView" class="space-y-4">
      <div class="flex gap-2 overflow-x-auto py-1" id="cityFilter"></div>
      <div id="locationList" class="space-y-4">
        <!-- 加载动画 -->
        <div class="animate-pulse bg-white rounded-2xl h-48 w-full border border-slate-200"></div>
      </div>
    </div>

    <!-- 视图 2：行程安排 -->
    <div id="itineraryView" class="space-y-4 hidden">
      <div id="itineraryList" class="space-y-6"></div>
    </div>
  </main>

  <!-- 照片大图弹窗 -->
  <div id="photoModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="handleBackdropClick(event)">
    <div class="bg-slate-900 text-white w-full max-w-md rounded-t-2xl sm:rounded-2xl overflow-hidden max-h-[92vh] flex flex-col border border-slate-800 shadow-2xl">
      
      <!-- 照片显示区 -->
      <div class="relative bg-black h-64 flex items-center justify-center overflow-hidden">
        <img id="modalImg" src="" class="w-full h-full object-cover transition-opacity duration-200">
        
        <span id="modalCityTag" class="absolute top-3 left-3 bg-red-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider"></span>
        <button onclick="closeModal()" class="absolute top-3 right-3 bg-black/60 text-white w-8 h-8 rounded-full flex items-center justify-center z-10">
          <i class="fa-solid fa-xmark"></i>
        </button>

        <!-- 左右切换按钮 -->
        <button id="prevBtn" onclick="changePhoto(-1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black/90 text-white w-8 h-8 rounded-full hidden flex items-center justify-center">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <button id="nextBtn" onclick="changePhoto(1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black/90 text-white w-8 h-8 rounded-full hidden flex items-center justify-center">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>

        <!-- 照片数量计数器 -->
        <span id="photoBadge" class="absolute bottom-12 right-3 bg-black/70 text-white text-[10px] px-2 py-0.5 rounded-full hidden"></span>

        <!-- 缩略图条 -->
        <div id="thumbnailStrip" class="absolute bottom-2 inset-x-0 flex justify-center gap-1.5 px-3 overflow-x-auto py-1"></div>
      </div>

      <!-- 详细介绍 -->
      <div class="p-5 overflow-y-auto space-y-3">
        <h2 id="modalTitle" class="text-xl font-bold leading-tight"></h2>
        <p id="modalAddress" class="text-xs text-slate-400 flex items-center gap-1.5 hidden">
          <i class="fa-solid fa-location-dot text-red-400"></i>
          <span></span>
        </p>
        <p id="modalDesc" class="text-sm text-slate-300 leading-relaxed"></p>

        <a id="modalMapBtn" href="#" target="_blank" rel="noopener" class="mt-4 flex items-center justify-center gap-2 w-full bg-red-600 hover:bg-red-500 text-white font-medium py-2.5 rounded-xl text-sm transition">
          <i class="fa-solid fa-map-location-dot"></i> 在地图中打开
        </a>
      </div>
    </div>
  </div>

  <script>
    let appData = { locations: [], itinerary: [] };
    let selectedCity = '全部';
    let locationPhotoMap = {};
    let currentPhotos = [];
    let currentPhotoIdx = 0;

    async function init() {
      try {
        const res = await fetch('./locations.json?t=' + Date.now());
        if (res.ok) {
          appData = await res.json();
        }
      } catch (e) {
        console.error('无法读取 locations.json', e);
      }

      renderCityFilter();
      renderItinerary();
      await loadAllPhotosFromGitHub();
      renderLocations();
    }

    function getGitHubRepoInfo() {
      if (appData.github && appData.github.owner && appData.github.repo) {
        return appData.github;
      }
      const hostParts = window.location.hostname.split('.');
      if (hostParts.length >= 3 && hostParts[1] === 'github' && hostParts[2] === 'io') {
        const owner = hostParts[0];
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const repo = pathSegments[0] || owner;
        return { owner, repo };
      }
      return null;
    }

    async function fetchPhotosFromFolder(folderPath) {
      const repoInfo = getGitHubRepoInfo();
      if (!repoInfo) return [];

      const apiUrl = `https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/contents/${folderPath}`;
      try {
        const res = await fetch(apiUrl);
        if (!res.ok) return [];
        const files = await res.json();
        if (!Array.isArray(files)) return [];

        const imageExts = ['.jpg', '.jpeg', '.png', '.gif', '.webp'];
        return files
          .filter(f => f.type === 'file' && imageExts.some(ext => f.name.toLowerCase().endsWith(ext)))
          .map(f => `./${f.path}`);
      } catch (e) {
        return [];
      }
    }

    async function loadAllPhotosFromGitHub() {
      const promises = appData.locations.map(async (item) => {
        if (item.folder) {
          const photos = await fetchPhotosFromFolder(item.folder);
          if (photos.length > 0) {
            locationPhotoMap[item.id] = photos;
            return;
          }
        }
        if (item.images && Array.isArray(item.images)) {
          locationPhotoMap[item.id] = item.images;
        } else if (item.imageUrl) {
          locationPhotoMap[item.id] = [item.imageUrl];
        } else {
          locationPhotoMap[item.id] = ['https://images.unsplash.com/photo-1548013146-72479768bada'];
        }
      });
      await Promise.all(promises);
    }

    function switchTab(tab) {
      const locView = document.getElementById('locationsView');
      const itinView = document.getElementById('itineraryView');
      const locBtn = document.getElementById('tabLocBtn');
      const itinBtn = document.getElementById('tabItinBtn');

      if (tab === 'locations') {
        locView.classList.remove('hidden');
        itinView.classList.add('hidden');
        locBtn.className = 'flex-1 py-2.5 text-center text-xs font-bold border-b-2 border-red-600 text-red-600';
        itinBtn.className = 'flex-1 py-2.5 text-center text-xs font-bold text-slate-400 border-b-2 border-transparent';
      } else {
        locView.classList.add('hidden');
        itinView.classList.remove('hidden');
        itinBtn.className = 'flex-1 py-2.5 text-center text-xs font-bold border-b-2 border-red-600 text-red-600';
        locBtn.className = 'flex-1 py-2.5 text-center text-xs font-bold text-slate-400 border-b-2 border-transparent';
      }
    }

    function renderCityFilter() {
      const cities = ['全部', ...new Set(appData.locations.map(i => i.city).filter(Boolean))];
      document.getElementById('cityFilter').innerHTML = cities.map(c => `
        <button onclick="filterCity('${c}')" class="px-3 py-1 rounded-full text-xs font-medium shrink-0 transition ${selectedCity === c ? 'bg-red-600 text-white shadow-xs' : 'bg-white text-slate-600 border border-slate-200'}">
          ${c}
        </button>
      `).join('');
    }

    function filterCity(city) {
      selectedCity = city;
      renderCityFilter();
      renderLocations();
    }

    function renderLocations() {
      const filtered = appData.locations.filter(i => selectedCity === '全部' || i.city === selectedCity);
      document.getElementById('locationList').innerHTML = filtered.map(item => {
        const photos = locationPhotoMap[item.id] || ['https://images.unsplash.com/photo-1548013146-72479768bada'];
        const coverImg = photos[0];
        return `
          <div class="bg-white rounded-2xl overflow-hidden shadow-xs border border-slate-200">
            <div class="relative h-44 bg-slate-100 cursor-pointer" onclick="openModalForLocation('${item.id}')">
              <img src="${coverImg}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1548013146-72479768bada'">
              ${item.city ? `<span class="absolute top-3 left-3 px-2.5 py-0.5 bg-red-600 text-white text-[10px] font-bold rounded-full">${item.city}</span>` : ''}
              <span class="absolute bottom-3 right-3 bg-black/70 text-white text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1">
                <i class="fa-solid fa-camera"></i> ${photos.length} 张照片
              </span>
            </div>
            <div class="p-3.5 space-y-2">
              <h3 class="font-bold text-sm text-slate-800">${item.name}</h3>
              <p class="text-xs text-slate-500 line-clamp-2">${item.description || ''}</p>
              <div class="pt-2 border-t flex justify-between items-center text-xs">
                <button onclick="openModalForLocation('${item.id}')" class="text-red-600 font-semibold flex items-center gap-1">
                  <i class="fa-solid fa-images"></i> 查看照片
                </button>
                ${item.mapsUrl ? `<a href="${item.mapsUrl}" target="_blank" class="text-slate-400 hover:text-red-600 flex items-center gap-1">地图 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></a>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderItinerary() {
      if (!appData.itinerary || appData.itinerary.length === 0) return;
      const itinList = document.getElementById('itineraryList');
      itinList.innerHTML = appData.itinerary.map(dayPlan => `
        <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200 space-y-3">
          <div class="flex items-center justify-between border-b pb-2">
            <div class="flex items-center space-x-2">
              <span class="px-2 py-0.5 bg-red-100 text-red-600 text-xs font-bold rounded">${dayPlan.day}</span>
              <h2 class="font-bold text-sm text-slate-800">${dayPlan.title}</h2>
            </div>
            <span class="text-[10px] text-slate-400 font-medium">${dayPlan.city || ''}</span>
          </div>
          <div class="space-y-2.5 relative pl-3 border-l-2 border-red-200 ml-1">
            ${dayPlan.steps.map(step => {
              const loc = appData.locations.find(l => String(l.id) === String(step.locationId)) || {};
              return `
                <div onclick="openModalForLocation('${step.locationId}')" class="bg-slate-50 hover:bg-red-50/50 p-2.5 rounded-xl border border-slate-100 hover:border-red-200 cursor-pointer transition active:scale-[0.98] space-y-1">
                  <div class="flex items-center justify-between">
                    <span class="text-[10px] font-bold text-red-600 bg-red-100/80 px-2 py-0.5 rounded-md">${step.time}</span>
                    <span class="text-xs font-bold text-red-600 flex items-center gap-1">
                      ${loc.name || '查看景点'} <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </span>
                  </div>
                  <p class="text-xs text-slate-600 font-medium">${step.activity}</p>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    function openModalForLocation(id) {
      const item = appData.locations.find(l => String(l.id) === String(id));
      if (!item) return;

      currentPhotos = locationPhotoMap[item.id] || [];
      currentPhotoIdx = 0;

      document.getElementById('modalTitle').textContent = item.name;
      document.getElementById('modalCityTag').textContent = item.city || '景点';
      document.getElementById('modalDesc').textContent = item.description || '暂无详细介绍。';

      const addrEl = document.getElementById('modalAddress');
      if (item.address) {
        addrEl.querySelector('span').textContent = item.address;
        addrEl.classList.remove('hidden');
      } else {
        addrEl.classList.add('hidden');
      }

      const mapBtn = document.getElementById('modalMapBtn');
      if (item.mapsUrl) {
        mapBtn.href = item.mapsUrl;
        mapBtn.classList.remove('hidden');
      } else {
        mapBtn.classList.add('hidden');
      }

      updateModalPhoto();
      document.getElementById('photoModal').classList.remove('hidden');
    }

    function updateModalPhoto() {
      const imgEl = document.getElementById('modalImg');
      imgEl.src = currentPhotos[currentPhotoIdx];

      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const badge = document.getElementById('photoBadge');
      const thumbs = document.getElementById('thumbnailStrip');

      if (currentPhotos.length > 1) {
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
        badge.classList.remove('hidden');
        badge.textContent = `${currentPhotoIdx + 1} / ${currentPhotos.length}`;

        thumbs.innerHTML = currentPhotos.map((src, i) => `
          <button onclick="setPhotoIndex(${i})" class="w-9 h-9 rounded-lg overflow-hidden border-2 shrink-0 transition ${i === currentPhotoIdx ? 'border-red-500 scale-105' : 'border-white/40 opacity-60'}">
            <img src="${src}" class="w-full h-full object-cover">
          </button>
        `).join('');
      } else {
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        badge.classList.add('hidden');
        thumbs.innerHTML = '';
      }
    }

    function changePhoto(dir) {
      currentPhotoIdx = (currentPhotoIdx + dir + currentPhotos.length) % currentPhotos.length;
      updateModalPhoto();
    }

    function setPhotoIndex(idx) {
      currentPhotoIdx = idx;
      updateModalPhoto();
    }

    function closeModal() {
      document.getElementById('photoModal').classList.add('hidden');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'photoModal') closeModal();
    }

    function clearAndReload() {
      window.location.reload();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
