<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Photo Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-800/90 backdrop-blur border-b border-slate-700 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-map-location-dot text-indigo-400 text-xl"></i>
        <h1 class="font-bold text-lg tracking-tight">Location Explorer</h1>
      </div>
      <span id="item-count" class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded-full">0 locations</span>
    </div>
  </header>

  <!-- Search & Filter Bar -->
  <div class="max-w-md mx-auto w-full px-4 pt-4 space-y-3">
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search location or city..." 
        class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded-xl pl-9 pr-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition"
      />
    </div>

    <!-- Category Pills -->
    <div id="category-container" class="flex gap-2 overflow-x-auto no-scrollbar py-1">
      <button class="cat-btn active bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-full whitespace-nowrap font-medium" data-cat="all">All</button>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="max-w-md mx-auto w-full flex-1 px-4 py-4 space-y-4">
    <!-- Locations Grid -->
    <div id="locations-list" class="space-y-4">
      <div class="text-center py-12 text-slate-400 space-y-2">
        <i class="fa-solid fa-spinner animate-spin text-2xl text-indigo-400"></i>
        <p class="text-sm">Loading locations.json...</p>
      </div>
    </div>
  </main>

  <!-- Image & Detail Modal -->
  <div id="photo-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    <div class="bg-slate-800 w-full max-w-md rounded-t-2xl sm:rounded-2xl overflow-hidden max-h-[90vh] flex flex-col border border-slate-700 shadow-2xl animate-in slide-in-from-bottom duration-200">
      
      <!-- Modal Header -->
      <div class="relative bg-black h-64 flex items-center justify-center">
        <img id="modal-img" src="" alt="Location Photo" class="w-full h-full object-cover">
        <button id="close-modal" class="absolute top-3 right-3 bg-black/60 hover:bg-black/90 text-white w-8 h-8 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-5 overflow-y-auto space-y-3">
        <div class="flex items-start justify-between gap-2">
          <div>
            <span id="modal-category" class="text-xs font-semibold text-indigo-400 uppercase tracking-wider"></span>
            <h2 id="modal-title" class="text-xl font-bold text-white leading-tight"></h2>
          </div>
        </div>

        <p id="modal-address" class="text-xs text-slate-400 flex items-center gap-1.5">
          <i class="fa-solid fa-location-dot text-rose-400"></i>
          <span></span>
        </p>

        <p id="modal-desc" class="text-sm text-slate-300 leading-relaxed"></p>

        <a id="modal-map-link" href="#" target="_blank" rel="noopener" class="mt-4 flex items-center justify-center gap-2 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl text-sm transition">
          <i class="fa-solid fa-map"></i> Open in Maps
        </a>
      </div>
    </div>
  </div>

  <script>
    let locations = [];
    let selectedCategory = 'all';

    async function loadLocations() {
      const container = document.getElementById('locations-list');
      try {
        const response = await fetch('locations.json');
        if (!response.ok) throw new Error('locations.json not found');
        locations = await response.json();
        buildCategories();
        renderLocations();
      } catch (err) {
        container.innerHTML = `
          <div class="bg-rose-950/40 border border-rose-800 rounded-xl p-4 text-center space-y-2">
            <i class="fa-solid fa-triangle-exclamation text-rose-400 text-2xl"></i>
            <p class="text-sm text-rose-200 font-medium">Could not load locations.json</p>
            <p class="text-xs text-slate-400">Make sure locations.json is in the same folder on GitHub.</p>
          </div>
        `;
      }
    }

    function buildCategories() {
      const categories = ['all', ...new Set(locations.map(item => item.category || 'General'))];
      const catContainer = document.getElementById('category-container');
      catContainer.innerHTML = categories.map(cat => `
        <button class="cat-btn text-xs px-3 py-1.5 rounded-full whitespace-nowrap font-medium capitalize border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-cat="${cat}">
          ${cat}
        </button>
      `).join('');

      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.cat-btn').forEach(b => {
            b.classList.remove('bg-indigo-600', 'text-white');
            b.classList.add('bg-slate-800', 'text-slate-300');
          });
          e.target.classList.remove('bg-slate-800', 'text-slate-300');
          e.target.classList.add('bg-indigo-600', 'text-white');
          selectedCategory = e.target.dataset.cat;
          renderLocations();
        });
      });
    }

    function renderLocations() {
      const container = document.getElementById('locations-list');
      const query = document.getElementById('search-input').value.toLowerCase();

      const filtered = locations.filter(item => {
        const matchCat = selectedCategory === 'all' || item.category === selectedCategory;
        const matchSearch = item.name.toLowerCase().includes(query) || 
                            (item.address && item.address.toLowerCase().includes(query)) ||
                            (item.city && item.city.toLowerCase().includes(query));
        return matchCat && matchSearch;
      });

      document.getElementById('item-count').textContent = `${filtered.length} locations`;

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center py-8 text-sm text-slate-400">No matching locations found.</p>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div onclick="openModal('${item.id}')" class="bg-slate-800 hover:bg-slate-750 border border-slate-700/80 rounded-2xl overflow-hidden cursor-pointer transition transform active:scale-[0.98] shadow-lg flex flex-col">
          <div class="relative h-48 bg-slate-950 overflow-hidden">
            <img src="${item.imageUrl}" alt="${item.name}" loading="lazy" class="w-full h-full object-cover transition duration-300 hover:scale-105" onError="this.src='https://placehold.co/600x400/1e293b/94a3b8?text=Photo+Not+Found'">
            ${item.category ? `<span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur text-indigo-300 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">${item.category}</span>` : ''}
          </div>
          <div class="p-4 space-y-1">
            <h3 class="font-bold text-white text-base leading-snug">${item.name}</h3>
            ${item.address ? `<p class="text-xs text-slate-400 line-clamp-1"><i class="fa-solid fa-location-dot text-rose-400 mr-1"></i>${item.address}</p>` : ''}
          </div>
        </div>
      `).join('');
    }

    function openModal(id) {
      const item = locations.find(l => l.id == id);
      if (!item) return;

      document.getElementById('modal-img').src = item.imageUrl;
      document.getElementById('modal-title').textContent = item.name;
      document.getElementById('modal-category').textContent = item.category || 'Location';
      document.getElementById('modal-address').querySelector('span').textContent = item.address || 'Address not specified';
      document.getElementById('modal-desc').textContent = item.description || 'No description provided.';
      
      const mapBtn = document.getElementById('modal-map-link');
      if (item.mapsUrl) {
        mapBtn.href = item.mapsUrl;
        mapBtn.classList.remove('hidden');
      } else {
        mapBtn.classList.add('hidden');
      }

      document.getElementById('photo-modal').classList.remove('hidden');
    }

    document.getElementById('close-modal').addEventListener('click', () => {
      document.getElementById('photo-modal').classList.add('hidden');
    });

    document.getElementById('search-input').addEventListener('input', renderLocations);

    window.addEventListener('DOMContentLoaded', loadLocations);
  </script>
</body>
</html>
